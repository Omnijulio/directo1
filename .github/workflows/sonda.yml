name: sonda-feb
on:
  push:
    branches: [sonda]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probar API LiveStats
        run: |
          mkdir -p sonda2
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for p in 2535745 2535753; do
            TOKEN=$(curl -sSL -A "$UA" "https://baloncestoenvivo.feb.es/Partido.aspx?p=$p" | grep -o 'id="_ctl0_token" value="[^"]*"' | sed 's/.*value="//;s/"$//')
            echo "token len ${#TOKEN}"
            for ep in KeyFacts BoxScore; do
              curl -sS -A "$UA" -H "Authorization: Bearer $TOKEN" -H "Origin: https://baloncestoenvivo.feb.es" -H "Referer: https://baloncestoenvivo.feb.es/" \
                -D sonda2/${ep}_${p}.headers "https://intrafeb.feb.es/LiveStats.API/api/v1/$ep/$p" -o sonda2/${ep}_${p}.json || true
            done
          done
          curl -sS -D sonda2/ntfy_cors.headers -o /dev/null -H "Origin: https://omnijulio.github.io" "https://ntfy.sh/re-test-probe-x7/json?poll=1" || true
          ls -la sonda2
      - name: Guardar
        run: |
          git config user.name "sonda"; git config user.email "sonda@users.noreply.github.com"
          git add sonda2 && git commit -m "sonda api" && git push origin sonda
