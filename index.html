/* ======================================================================
   SISTEMA VISUAL · DIRECTOS RADIO EVOLUCIÓN
   Base fija: tinta (azul noche) + marfil + tipografía serif/sans + Burgos.
   Por evento solo cambia el acento (config.json → tema.acento) y el contenido.
   ====================================================================== */
:root{
  --ink:#0F1726; --ink2:#18233A; --ivory:#F5EFE4; --ivory2:#E9E0CF; --slate:#5B6576; --muted:#9AA5B5;
  --brand:#EE6A2A; --celeste:#56BED8; --live:#D9302B;
  --acc:#EE6A2A;          /* acento del tema (se sobrescribe por evento) */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:"Sans",system-ui,sans-serif;color:var(--ivory);-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
.abs{position:absolute}
.num{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1}
.serif{font-family:"Serif",Georgia,serif}
.caps{font-weight:700;letter-spacing:.24em;text-transform:uppercase}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.sh{box-shadow:0 14px 36px rgba(5,9,18,.45)}

/* ---------- fondos de espera / cierre ---------- */
#bg{position:fixed;inset:0;background:radial-gradient(120% 100% at 75% 25%,#1C2944 0%,#0F1726 55%,#0A0F1A 100%);opacity:0;transition:opacity .9s;pointer-events:none}
.s-espera #bg,.s-fin #bg{opacity:1}

/* ---------- marca ---------- */
#brand{left:40px;top:34px;height:94px;display:flex;align-items:center;z-index:5}
#logo{width:94px;height:94px;border-radius:50%;overflow:hidden;background:#fff;position:relative;z-index:2;box-shadow:0 0 0 3px var(--ivory),0 0 0 4.5px rgba(15,23,38,.6),0 10px 26px rgba(0,0,0,.45)}
#logo img{width:100%;height:100%;display:block}
#brandtxt{margin-left:-47px;padding:0 30px 0 66px;height:74px;border-radius:0 37px 37px 0;background:rgba(15,23,38,.92);display:flex;flex-direction:column;justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(245,239,228,.10)}
#brandtxt .t1{font-family:"Serif";font-weight:700;font-size:27px;line-height:1;letter-spacing:.2px}
#brandtxt .t2{margin-top:7px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
#brandtxt .t2 i{width:4px;height:4px;border-radius:50%;background:var(--acc)}
#brandtxt .t2 b{color:var(--celeste);font-weight:900;letter-spacing:.12em}

/* ---------- directo + hora ---------- */
#live{right:40px;top:50px;height:46px;display:flex;align-items:center;border-radius:23px;background:rgba(15,23,38,.92);box-shadow:inset 0 0 0 1px rgba(245,239,228,.10),0 12px 30px rgba(5,9,18,.4);z-index:5}
#live .p{display:flex;align-items:center;gap:11px;padding:0 18px 0 18px;font-size:15px}
#live .p i{width:11px;height:11px;border-radius:50%;background:var(--live);box-shadow:0 0 0 4px rgba(217,48,43,.25);animation:pulse 1.6s ease-in-out infinite}
#live .h{border-left:1px solid rgba(245,239,228,.18);padding:0 20px 0 18px;font-weight:900;font-size:20px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- medallón (sello del tema) ---------- */
#seal{right:44px;top:116px;width:150px;height:150px;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s}
#seal svg{position:absolute;inset:0}
#seal .spin{animation:spin 60s linear infinite;transform-origin:75px 75px}
#seal .ctr{position:absolute;inset:30px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);text-align:center}
#seal .ctr b{font-family:"Serif";font-weight:900;font-size:40px;line-height:.92}
#seal.dflt .ctr b{font-style:italic;font-weight:500;font-size:25px;line-height:1}
#seal.dflt .ctr span{font-size:9px;letter-spacing:.2em;margin-top:6px}
#seal .ctr span{font-weight:900;font-size:10.5px;letter-spacing:.28em;margin:4px 0 0 .28em;color:var(--acc)}
@keyframes spin{to{transform:rotate(360deg)}}
.s-espera #seal{transform:translate(-330px,250px) scale(1.95)}

/* ---------- rótulo inferior ---------- */
#lt{left:40px;top:856px;height:120px;display:flex;align-items:stretch;transition:opacity .4s}
#lt .bar{width:16px;background:var(--ink);border-radius:10px 0 0 10px;position:relative}
#lt .bar:after{content:"";position:absolute;right:0;top:0;bottom:0;width:4px;background:var(--acc)}
#lt .card{position:relative;background:var(--ivory);color:var(--ink);padding:0 48px 0 30px;display:flex;flex-direction:row;align-items:center;border-radius:0 10px 10px 0;
  min-width:640px;max-width:1300px;clip-path:inset(-120px 100% 0 0);transition:clip-path .8s cubic-bezier(.7,0,.2,1)}
#lt.on .card{clip-path:inset(-120px 0 0 0)}
#lt .txt{display:flex;flex-direction:column;justify-content:center;min-width:0}
#lt .lcrest{margin-right:26px;opacity:0;transform:scale(.8);transition:opacity .45s .35s,transform .45s .35s}
#lt.on .lcrest{opacity:1;transform:none}
#lt .lcrest:empty{display:none}
#lt .lcrest .crest{box-shadow:0 0 0 2px rgba(15,23,38,.12),0 4px 12px rgba(15,23,38,.18)}
#lt .chip{font-size:13px;color:var(--acc);margin-bottom:5px}
#lt .ti{font-family:"Serif";font-weight:900;font-size:46px;line-height:1.04;white-space:nowrap}
#lt .su{font-weight:600;font-size:21px;color:var(--slate);margin-top:6px;white-space:nowrap}
#lt .chip,#lt .ti,#lt .su{opacity:0;transform:translateY(12px);transition:opacity .45s .4s,transform .45s .4s}
#lt.on .chip,#lt.on .ti,#lt.on .su{opacity:1;transform:none}
#lt .sky{position:absolute;right:26px;bottom:100%;margin-bottom:-1px;color:var(--ivory);opacity:0;transform:translateY(10px);transition:opacity .6s .7s,transform .6s .7s}
#lt.on .sky{opacity:1;transform:none}
#lt .sky{--skl:#0F1726;--skw:2.6}
#lt .tag{position:absolute;left:16px;top:-38px;height:38px;background:var(--ink);border-radius:9px 9px 0 0;padding:0 18px 0 15px;display:flex;align-items:center;gap:10px;font-size:13.5px;
  opacity:0;transition:opacity .4s .5s}
#lt.on .tag{opacity:1}
#lt .tag svg{flex-shrink:0}
.s-espera #lt,.s-fin #lt{opacity:0}

/* ---------- ticker ---------- */
#tk{left:0;top:1012px;width:1920px;height:52px;display:flex;background:rgba(15,23,38,.94);box-shadow:inset 0 1px 0 rgba(245,239,228,.10)}
#tk .lab{flex-shrink:0;background:var(--acc);color:#fff;display:flex;align-items:center;padding:0 24px 0 40px;font-size:15px;position:relative;z-index:2}
#tk .lab:after{content:"";position:absolute;right:-14px;top:0;border-left:14px solid var(--acc);border-top:26px solid transparent;border-bottom:26px solid transparent}
#tk .win{flex:1;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 40px,#000 calc(100% - 60px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 40px,#000 calc(100% - 60px),transparent 100%)}
#tk .track{position:absolute;left:0;top:0;height:52px;display:flex;align-items:center;white-space:nowrap;will-change:transform}
#tk .it{display:flex;align-items:center;font-weight:600;font-size:21px;padding:0 24px}
#tk .it svg{margin-right:24px;flex-shrink:0}
#tk .it b{font-weight:900;color:var(--acc)}

/* ---------- tarjetas laterales ---------- */
.side{left:1420px;top:300px;width:460px;border-radius:14px;background:rgba(15,23,38,.94);overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(245,239,228,.10),0 16px 40px rgba(5,9,18,.45);
  opacity:0;transform:translateX(50px);transition:opacity .6s,transform .7s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.side.on{opacity:1;transform:none}
.side:before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--acc)}
.side .hd{display:flex;align-items:center;gap:12px;padding:24px 26px 0;font-size:12.5px;color:var(--acc)}
.side .hd:after{content:"";flex:1;height:1px;background:rgba(245,239,228,.14)}
.s-espera .side,.s-fin .side{opacity:0!important}

/* ---------- escudos ---------- */
.crest{position:relative;flex-shrink:0;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 0 0 2px rgba(245,239,228,.85),0 6px 16px rgba(0,0,0,.28)}
.crest img{width:84%;height:84%;object-fit:contain;display:block}
.crest.txt{background:var(--tc,#3A4659);color:#fff;font-family:"Serif";font-weight:900;letter-spacing:.02em}

/* ---------- marcador del partido (sustituye al medallón) ---------- */
#score{right:40px;top:114px;width:520px;border-radius:14px;background:rgba(15,23,38,.94);overflow:hidden;display:none;
  box-shadow:inset 0 0 0 1px rgba(245,239,228,.10),0 14px 36px rgba(5,9,18,.45)}
#score:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--acc)}
#score .row{display:flex;align-items:center;gap:10px;padding:22px 20px 14px}
#score .tm{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
#score .tm.v{flex-direction:row-reverse}
#score .nm{font-weight:900;font-size:15px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#score .pts{font-family:"Serif";font-weight:900;font-size:50px;line-height:1;min-width:64px;text-align:center}
#score .pts.win{color:var(--acc)}
#score .mid{font-weight:900;font-size:12px;letter-spacing:.2em;color:var(--muted);min-width:28px;text-align:center;text-transform:uppercase}
#score.pre .mid{font-family:"Serif";font-style:italic;font-weight:500;letter-spacing:0;font-size:30px;color:var(--ivory);text-transform:none}
#score.pre .pts{display:none}
#score .ft{border-top:1px solid rgba(245,239,228,.10);padding:9px 20px 11px;font-size:11.5px;color:var(--muted);text-align:center}
.s-espera #score,.s-fin #score{opacity:0}

/* ---------- tarjeta: el partido ---------- */
#cMatch .mrow{display:flex;align-items:flex-start;justify-content:space-between;padding:22px 22px 4px}
#cMatch .mt{width:140px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;font-family:"Serif";font-weight:700;font-size:18px;line-height:1.2}
#cMatch .mc{align-self:center;margin-top:-26px;display:flex;align-items:center;gap:10px;font-family:"Serif";font-weight:900;font-size:58px;line-height:1}
#cMatch .mc i{font-style:italic;font-weight:500;font-size:34px;color:var(--muted)}
#cMatch .mc b.win{color:var(--acc)}
#cMatch .meta{padding:16px 26px 0;display:flex;flex-direction:column;gap:9px}
#cMatch .meta div{display:flex;gap:12px;font-weight:600;font-size:15.5px;color:#D5DCE6}
#cMatch .meta span{flex-shrink:0;width:118px;font-weight:700;font-size:11.5px;letter-spacing:.2em;color:var(--acc);text-transform:uppercase;padding-top:3px}
#cMatch .next{margin:18px 26px 24px;padding:12px 15px;border:1px solid rgba(245,239,228,.16);border-radius:10px;font-weight:600;font-size:14.5px;line-height:1.45;color:#D5DCE6}
#cMatch .next b{display:block;font-weight:700;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:3px}
#cMatch .next:empty{display:none}

#cCifra .big{display:flex;align-items:center;gap:16px;padding:6px 26px 0}
#cCifra .big b{font-family:"Serif";font-weight:900;font-size:92px;line-height:1;letter-spacing:-1px}
#cCifra .big span{font-weight:600;font-size:19px;line-height:1.25;color:#D5DCE6}
#cCifra svg{display:block;margin:6px 10px 2px}
#cCifra .dots{stroke:#2B3850;stroke-linecap:round}
#cCifra .arc{fill:none;stroke:var(--acc);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
#cCifra.on .arc{animation:draw 1.6s .7s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#cCifra .pin{opacity:0}
#cCifra.on .pin{animation:pinIn .5s forwards}
@keyframes pinIn{to{opacity:1}}
#cCifra .halo{transform-box:fill-box;transform-origin:center;animation:halo 2.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
#cCifra .lbl{font-family:"Sans";font-weight:900;font-size:12px;letter-spacing:1.6px;fill:var(--ivory);paint-order:stroke;stroke:var(--ink);stroke-width:3px}
#cCifra .foot{padding:0 26px 22px;font-weight:600;font-size:14.5px;line-height:1.4;color:var(--muted)}
#cCifra .foot:empty{display:none}

#cWho .list{padding:12px 26px 22px}
#cWho .p{display:flex;gap:16px;padding:14px 0;opacity:0;transform:translateX(26px);transition:opacity .5s,transform .5s}
#cWho .p+.p{border-top:1px solid rgba(245,239,228,.09)}
#cWho.on .p{opacity:1;transform:none}
#cWho.on .p:nth-child(2){transition-delay:.15s}#cWho.on .p:nth-child(3){transition-delay:.3s}#cWho.on .p:nth-child(4){transition-delay:.45s}
#cWho .n{flex-shrink:0;width:30px;font-family:"Serif";font-weight:900;font-size:30px;line-height:1;color:var(--acc)}
#cWho .now{display:flex;align-items:center;gap:7px;font-weight:900;font-size:10.5px;letter-spacing:.22em;color:#FF6B5E;margin-bottom:5px}
#cWho .now:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.6s infinite}
#cWho .nm{font-family:"Serif";font-weight:700;font-size:23px;line-height:1.15}
#cWho .cg{font-weight:600;font-size:15.5px;color:#C7CFDA;margin-top:5px;line-height:1.35}

#cCita{padding-bottom:26px}
#cCita q{display:block;quotes:"«" "»";padding:14px 26px 0;font-family:"Serif";font-style:italic;font-weight:500;font-size:38px;line-height:1.16}
#cCita q:before{content:open-quote;color:var(--acc)}
#cCita q:after{content:close-quote;color:var(--acc)}
#cCita .meta{display:flex;gap:9px;flex-wrap:wrap;padding:20px 26px 0}
#cCita .meta span{font-weight:700;font-size:14.5px;border:1px solid rgba(245,239,228,.18);border-radius:20px;padding:6px 13px}
#cCita .meta span b{color:var(--acc);font-weight:900}

/* ---------- escena de espera ---------- */
#wait{left:0;top:0;width:1920px;height:1080px;opacity:0;transition:opacity .9s;pointer-events:none}
.s-espera #wait{opacity:1}
#wait .sky{position:absolute;left:1050px;top:688px;color:rgba(245,239,228,.075)}
#wait .sky{--skl:#0F1726;--skw:1.3}
#wait .col{position:absolute;left:120px;top:230px;width:900px;display:flex;flex-direction:column}
#wait .kick{font-size:17px;color:var(--acc)}
#wait h1{margin-top:22px;font-family:"Serif";font-weight:900;font-size:86px;line-height:1.02}
#wait h1 em{font-style:italic;font-weight:500;color:var(--acc)}
#wait .rule{margin:30px 0 22px;width:120px;height:0;border-top:3px double var(--acc)}
#wait .where{font-weight:600;font-size:24px;color:#C7CFDA}
#wait .cd{margin-top:34px;display:flex;align-items:center;gap:24px}
#wait .cd .l{font-size:15px;color:var(--muted);line-height:1.5}
#wait .cd .v{font-weight:900;font-size:78px;line-height:1}
#wait .who{position:absolute;left:120px;top:810px;display:flex;gap:14px}
#wait .who div{border-top:2px solid var(--acc);padding:12px 6px 0 0;width:292px}
#wait .who b{display:block;font-family:"Serif";font-weight:700;font-size:21px}
#wait .who span{display:block;font-weight:600;font-size:14.5px;color:#C7CFDA;margin-top:4px;line-height:1.35}

/* ---------- cierre ---------- */
#fin{left:0;top:0;width:1920px;height:1080px;opacity:0;transition:opacity .9s;pointer-events:none;text-align:center}
.s-fin #fin{opacity:1}
#fin .sky{position:absolute;left:50%;top:590px;margin-left:-560px;color:rgba(245,239,228,.07)}
#fin .sky{--skl:#0F1726;--skw:1.3}
#fin .in{position:absolute;left:0;right:0;top:330px;display:flex;flex-direction:column;align-items:center}
#fin .k{font-size:16px;color:var(--acc)}
#fin b{margin-top:18px;font-family:"Serif";font-weight:900;font-size:84px;line-height:1.05}
#fin .rule{margin:28px 0 20px;width:120px;border-top:3px double var(--acc)}
#fin span{font-weight:600;font-size:26px;color:#C7CFDA}

/* demo */
#demo{display:none;left:0;top:0;width:1920px;height:1080px;background:linear-gradient(160deg,#6d6a66,#a9a39b)}
#demo div{position:absolute;left:760px;top:360px;width:400px;height:520px;border-radius:200px 200px 40px 40px;background:rgba(40,40,46,.55)}
.demo #demo{display:block}
.s-espera #demo,.s-fin #demo{display:none!important}
</style>

l primer equipo del Tizona desde enero de 2026", "Pombar fue elegido **Mejor Entrenador del Mes** de mayo por la AEEB", "Próximo partido: **Copa España FEB** · Miércoles 21 de octubre, 20.30 h · Cajasol Coto Córdoba – Grupo Ureta Tizona", "Escúchanos en el **104.1 FM** y en **radioevolucion.es**"]}, "tarjetas": {"ciclo": ["partido"], "fija": "", "cada": 60, "dura": 22}, "fin": {"titulo": "Gracias por acompañarnos", "texto": "Más baloncesto en radioevolucion.es y en el 104.1 FM"}}]};
/* "programa": varios eventos en el mismo config; se activa el último cuyo "desde" ya ha pasado */
function pick(raw){
  if(!raw || !raw.programa || !raw.programa.length) return raw;
  var now = qs.has("ahora") ? Date.parse(qs.get("ahora")) : Date.now(), cur = raw.programa[0];  /* ?ahora= para previsualizar */
  raw.programa.forEach(function(e){ var t = Date.parse(e.desde); if(!isNaN(t) && t <= now) cur = e; });
  var o = JSON.parse(JSON.stringify(cur));
  o.equipos = Object.assign({}, raw.equipos || {}, cur.equipos || {});
  o.version = raw.version; return o;
}
var C = pick(RAW);
function g(path, def){ var o = C; for(var i=0;i<path.length;i++){ if(o == null) return def; o = o[path[i]]; } return o == null ? def : o; }

/* ---------- escala ---------- */
var stage = $("stage");
function fitStage(){ var w = innerWidth, h = innerHeight, k = Math.min(w/1920, h/1080);
  stage.style.transform = "translate(" + ((w-1920*k)/2) + "px," + ((h-1080*k)/2) + "px) scale(" + k + ")"; }
addEventListener("resize", fitStage); fitStage();

function esc(t){ return String(t == null ? "" : t).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function rich(t, tag){ return esc(t).replace(/\*\*(.+?)\*\*/g, "<" + (tag||"b") + ">$1</" + (tag||"b") + ">"); }
function fit(el, max, min){ el.style.fontSize = max + "px"; var s = max; while(el.scrollWidth > el.clientWidth + 1 && s > min){ s--; el.style.fontSize = s + "px"; } }
function pad(n){ return (n < 10 ? "0" : "") + n; }

/* ---------- escena ---------- */
var scene = "";
function startTime(){ var t = Date.parse(C.inicio); return isNaN(t) ? 0 : t; }
function tick(){
  var now = new Date();
  $("clock").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
  var s = C.escena || "auto";
  if(s === "auto") s = (startTime() && now.getTime() < startTime()) ? "espera" : "directo";
  if(qs.has("escena")) s = qs.get("escena");
  if(s !== scene){
    document.body.classList.remove("s-" + scene); scene = s; document.body.classList.add("s-" + s);
    $("liveTxt").textContent = s === "espera" ? "En breve" : "En directo";
    if(s === "directo") showLT(true);
  }
  if(s === "espera"){
    var sec = Math.ceil(Math.max(0, startTime() - now.getTime())/1000), h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), r = sec%60;
    $("wCd").textContent = h > 0 ? h + ":" + pad(m) + ":" + pad(r) : pad(m) + ":" + pad(r);
  }
}

/* ---------- equipos y escudos ---------- */
function team(id){ var t = (C.equipos || {})[id]; return t || {nombre:id || "", corto:id || ""}; }
function crest(id, size){
  var t = team(id), sig = esc(t.siglas || String(t.corto || t.nombre || "").slice(0,3).toUpperCase());
  var st = "width:" + size + "px;height:" + size + "px;--tc:" + esc(t.color || "#3A4659") + ";font-size:" + Math.round(size*.32) + "px";
  if(t.escudo) return "<span class='crest' style='" + st + "' data-sig='" + sig + "'><img src='" + esc(t.escudo) + "' alt='" + esc(t.nombre) + "' onerror=\"var s=this.parentNode;s.classList.add('txt');s.textContent=s.dataset.sig\"></span>";
  return "<span class='crest txt' style='" + st + "'>" + sig + "</span>";
}
function hasScore(p){ return p && typeof p.puntos_local === "number" && typeof p.puntos_visitante === "number"; }
var matchKey = null;
function renderMatch(){
  var p = C.partido, sc = $("score");
  var show = !!p && C.marcador !== false;
  sc.style.display = show ? "block" : "none";
  if(show) $("seal").style.display = "none";
  var key = JSON.stringify([p, C.equipos]); if(key === matchKey) return; matchKey = key;
  if(!p) return;
  var known = hasScore(p), L = team(p.local), V = team(p.visitante);
  sc.classList.toggle("pre", !known);
  $("sL").innerHTML = crest(p.local, 50) + "<span class='nm'>" + esc(L.corto || L.nombre) + "</span>";
  $("sV").innerHTML = crest(p.visitante, 50) + "<span class='nm'>" + esc(V.corto || V.nombre) + "</span>";
  $("sPL").textContent = known ? p.puntos_local : ""; $("sPV").textContent = known ? p.puntos_visitante : "";
  $("sPL").classList.toggle("win", known && p.puntos_local > p.puntos_visitante);
  $("sPV").classList.toggle("win", known && p.puntos_visitante > p.puntos_local);
  $("sMid").textContent = known ? (p.estado || "Final") : "vs";
  $("sFt").textContent = [p.competicion, p.jornada, known ? "" : (p.estado_previo || "")].filter(Boolean).join(" · ");
  $("mTitle").textContent = p.titulo_tarjeta || "El partido";
  $("mL").innerHTML = crest(p.local, 96) + "<span>" + esc(L.nombre) + "</span>";
  $("mV").innerHTML = crest(p.visitante, 96) + "<span>" + esc(V.nombre) + "</span>";
  $("mC").innerHTML = known ? "<b class='" + (p.puntos_local > p.puntos_visitante ? "win" : "") + "'>" + p.puntos_local + "</b><i>–</i><b class='" + (p.puntos_visitante > p.puntos_local ? "win" : "") + "'>" + p.puntos_visitante + "</b>" : "<i>vs</i>";
  $("mMeta").innerHTML = (p.datos || []).map(function(d){ return "<div><span>" + esc(d[0]) + "</span>" + esc(d[1]) + "</div>"; }).join("");
  $("mNext").innerHTML = p.proximo ? "<b>Próximo partido</b>" + esc(p.proximo) : "";
}

/* ---------- tema ---------- */
function applyTheme(){
  document.documentElement.style.setProperty("--acc", g(["tema","acento"], "#EE6A2A"));
  var sv = g(["sello","visible"], true);
  $("seal").style.display = sv ? "" : "none";
  $("sBig").textContent = g(["sello","grande"], "");
  $("sSmall").textContent = g(["sello","pequeno"], "");
  var ring = g(["sello","anillo"], "");
  $("ringTP").textContent = ring ? ring + " · " : "";
  $("ringText").style.display = ring ? "" : "none";
  $("ringRose").style.display = ring ? "none" : "";
  var dflt = !g(["sello","grande"], "");
  $("seal").classList.toggle("dflt", dflt);
  if(dflt){ $("sBig").textContent = "Burgos"; $("sSmall").textContent = "104.1 FM"; }
}

/* ---------- rótulo inferior ---------- */
var ltKey = null, ltSeq = 0;
function showLT(force){
  var lt = $("lt");
  if(C.rotulo === false){ lt.classList.remove("on"); ltKey = null; return; }
  var i = C.hablando|0, p = (C.ponentes || [])[i-1];
  if(p && altGeneral) p = null;
  var c = p ? {tag:"Interviene", chip:p.etiqueta || "", ti:p.nombre, su:p.cargo, eq:p.equipo || ""}
            : {tag:C.etiqueta || "", chip:C.antetitulo || "", ti:C.titulo || "", su:C.subtitulo || "", eq:C.equipo_rotulo || ""};
  var key = JSON.stringify(c); if(key === ltKey && !force) return;
  var wasOn = lt.classList.contains("on"); ltKey = key;
  var my = ++ltSeq;
  var paint = function(){
    if(my !== ltSeq) return;   /* evita que un repintado antiguo pise al último */
    $("ltTag").textContent = c.tag; lt.querySelector(".tag").style.display = c.tag ? "" : "none";
    $("ltChip").textContent = c.chip; $("ltChip").style.display = c.chip ? "" : "none";
    $("ltTi").textContent = c.ti; $("ltSu").textContent = c.su; $("ltSu").style.display = c.su ? "" : "none";
    $("ltCrest").innerHTML = c.eq ? crest(c.eq, 82) : "";
    fit($("ltTi"), c.chip ? 46 : 50, 28); fit($("ltSu"), 21, 15);
    void lt.offsetWidth; lt.classList.add("on");
  };
  if(wasOn){ lt.classList.remove("on"); setTimeout(paint, 800); } else paint();
}

/* alterna el rótulo del ponente con el rótulo general cada "rotulo_alterna" segundos */
var altGeneral = false, altT = 0;
setInterval(function(){
  var n = C.rotulo_alterna|0;
  if(scene === "directo" && n > 0 && (C.hablando|0) > 0){ if(++altT >= n){ altT = 0; altGeneral = !altGeneral; showLT(false); } }
  else if(altGeneral){ altGeneral = false; altT = 0; showLT(false); }
}, 1000);

/* ---------- ticker ---------- */
var tkKey = null, tkX = 0, tkW = 0, last = 0;
function buildTicker(){
  var items = g(["ticker","items"], []), key = JSON.stringify(items) + g(["ticker","titulo"], "");
  $("tk").style.display = g(["ticker","visible"], true) && items.length ? "" : "none";
  if(key === tkKey) return; tkKey = key;
  $("tkLab").textContent = g(["ticker","titulo"], "Claves");
  var sep = "<svg width='12' height='12' viewBox='0 0 20 20' style='color:var(--acc)'><use href='#quatre'/></svg>";
  var html = items.map(function(t){ return "<span class='it'>" + sep + "<span>" + rich(t) + "</span></span>"; }).join("");
  var tr = $("track"); tr.innerHTML = html + html; tkW = tr.scrollWidth / 2; if(tkX < -tkW) tkX = 0;
}
(function frame(t){
  var dt = last ? Math.min(100, t - last) : 16; last = t;
  if(tkW > 0){ tkX -= dt * 0.105; if(tkX <= -tkW) tkX += tkW; $("track").style.transform = "translate3d(" + tkX.toFixed(1) + "px,0,0)"; }
  requestAnimationFrame(frame);
})(0);

/* ---------- tarjetas ---------- */
var MAP = {L0:-130, B1:72, k:440/280, origin:[-3.70, 42.34]};
function proj(lon, lat){ return [(lon - MAP.L0) * MAP.k, (MAP.B1 - lat) * MAP.k]; }
var mapKey = null;
function buildMap(){
  var m = g(["tarjetas","cifra","mapa"], null), key = JSON.stringify(m);
  $("cfMap").style.display = m ? "" : "none";
  if(!m || key === mapKey) return; mapKey = key;
  var o = proj(MAP.origin[0], MAP.origin[1]), arcs = "", pins = "";
  var pin = function(x, y, name, delay, dx, dy, main){
    return "<g class='pin' style='animation-delay:" + delay + "s'><circle class='halo' cx='" + x + "' cy='" + y + "' r='6' fill='" + (main ? "#F5EFE4" : "var(--acc)") + "'/><circle cx='" + x + "' cy='" + y + "' r='5' fill='" + (main ? "#F5EFE4" : "var(--acc)") + "' stroke='#0F1726' stroke-width='1.5'/><text class='lbl' x='" + x + "' y='" + y + "' dx='" + dx + "' dy='" + dy + "'>" + esc(name) + "</text></g>";
  };
  pins += pin(o[0].toFixed(1), o[1].toFixed(1), "BURGOS", .3, 9, -9, true);
  (m.destinos || []).forEach(function(d, i){
    var p = proj(d.lon, d.lat), mx = (o[0] + p[0]) / 2, my = Math.min(o[1], p[1]) - 30 - Math.abs(o[0] - p[0]) * .25;
    arcs += "<path class='arc' style='animation-delay:" + (.7 + i*.4) + "s' d='M" + o[0].toFixed(1) + " " + o[1].toFixed(1) + " Q" + mx.toFixed(1) + " " + my.toFixed(1) + " " + p[0].toFixed(1) + " " + p[1].toFixed(1) + "'/>";
    var dx = p[0] > 360 ? -20 - d.nombre.length * 7 : -14;
    pins += pin(p[0].toFixed(1), p[1].toFixed(1), d.nombre, 2.1 + i*.4, dx, 22, false);
  });
  $("cfArcs").innerHTML = arcs; $("cfPins").innerHTML = pins;
  Array.prototype.forEach.call($("cfArcs").querySelectorAll(".arc"), function(a){ a.style.setProperty("--len", Math.ceil(a.getTotalLength()) + 2); });
}
function buildCards(){
  $("cfTitle").textContent = g(["tarjetas","cifra","titulo"], "");
  $("cfText").textContent = g(["tarjetas","cifra","texto"], "");
  $("cfFoot").textContent = g(["tarjetas","cifra","pie"], "");
  buildMap();
  $("whoTitle").textContent = g(["tarjetas","intervienen","titulo"], "Intervienen");
  var cur = C.hablando|0;
  $("whoList").innerHTML = (C.ponentes || []).map(function(p, i){
    return "<div class='p" + (cur === i+1 ? " cur" : "") + "'><div class='n'>" + (i+1) + "</div><div>" + (cur === i+1 ? "<div class='now'>HABLANDO</div>" : "") + "<div class='nm'>" + esc(p.nombre) + "</div><div class='cg'>" + esc(p.cargo) + "</div></div></div>";
  }).join("");
  $("citaTitle").textContent = g(["tarjetas","cita","titulo"], "");
  $("cita").textContent = g(["tarjetas","cita","texto"], "");
  $("citaMeta").innerHTML = g(["tarjetas","cita","datos"], []).map(function(t){ return "<span>" + rich(t) + "</span>"; }).join("");
  // espera y cierre
  $("wKick").textContent = g(["espera","antetitulo"], C.etiqueta || "");
  $("wTitle").innerHTML = rich(g(["espera","titulo"], C.titulo || ""), "em");
  $("wWhere").textContent = g(["espera","lugar"], "");
  $("wWho").innerHTML = (C.ponentes || []).slice(0, 4).map(function(p){ return "<div><b>" + esc(p.nombre) + "</b><span>" + esc(p.cargo) + "</span></div>"; }).join("");
  $("fTitle").textContent = g(["fin","titulo"], "Gracias por acompañarnos");
  $("fText").textContent = g(["fin","texto"], "Más información en radioevolucion.es y en el 104.1 FM");
}
var cards = {cifra:"cCifra", intervienen:"cWho", cita:"cCita", partido:"cMatch"}, shown = null, cycleIdx = 0, cycleT = 0;
function countUp(){
  var el = $("cnt"), raw = g(["tarjetas","cifra","numero"], ""), target = parseFloat(raw);
  if(isNaN(target)){ el.textContent = raw; return; }
  var t0 = performance.now(), fmt = function(v){ return Math.round(v).toLocaleString("es-ES"); };
  (function step(t){ var k = Math.min(1, (t - t0) / 1800); k = 1 - Math.pow(1 - k, 3); el.textContent = fmt(target * k); if(k < 1) requestAnimationFrame(step); })(t0);
}
function showCard(name){
  if(name === shown) return;
  Object.keys(cards).forEach(function(k){ $(cards[k]).classList.remove("on"); });
  var had = shown; shown = name || null;
  if(name && cards[name]){
    var el = $(cards[name]);
    setTimeout(function(){ void el.offsetWidth; el.classList.add("on"); if(name === "cifra") countUp(); }, had ? 450 : 0);
  }
}
setInterval(function(){
  if(scene !== "directo"){ showCard(null); return; }
  var fija = g(["tarjetas","fija"], ""); if(fija){ showCard(fija); return; }
  var list = g(["tarjetas","ciclo"], []).filter(function(n){ return cards[n]; });
  if(!list.length){ showCard(null); return; }
  var every = g(["tarjetas","cada"], 75), dura = g(["tarjetas","dura"], 20);
  cycleT++;
  if(cycleT === every - dura) showCard(list[cycleIdx % list.length]);
  if(cycleT >= every){ showCard(null); cycleT = 0; cycleIdx++; }
}, 1000);

/* ---------- aplicar ---------- */
function applyAll(){ applyTheme(); buildTicker(); buildCards(); renderMatch(); tick(); if(scene === "directo") showLT(false); }
setInterval(function(){ var n = pick(RAW); if(JSON.stringify(n) !== JSON.stringify(C)){ C = n; applyAll(); } }, 15000);

/* ---------- config.json en vivo (cada 5 s; si cambia "version", recarga) ---------- */
var loadedVer = null;
function poll(){
  if(!window.fetch || location.protocol === "file:") return;
  fetch("config.json?t=" + Date.now(), {cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; }).then(function(c){
    if(!c) return;
    if(loadedVer === null) loadedVer = c.version; else if(c.version !== loadedVer){ location.reload(); return; }
    RAW = c; C = pick(RAW); applyAll();
  }).catch(function(e){ if(window.console) console.warn("config", e); });
}
setInterval(tick, 500);
applyAll();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ tkKey = null; buildTicker(); if(scene === "directo") showLT(true); });
poll(); setInterval(poll, 5000);
})();
