function showPerson(key){if(!people[key])key='general';const p=people[key];document.querySelector('#lower').dataset.person=key;document.querySelector('#tag').textContent=p.tag;document.querySelector('#title').textContent=p.name;document.querySelector('#role').textContent=p.role;document.title='Radio Evolución · '+p.name;}

const current=params.get('persona')||'general';
showPerson(current);resize();

const ready=document.fonts ? document.fonts.ready : Promise.resolve();
ready.then(()=>{const lower=document.querySelector('#lower');lower.style.animation='none';void lower.offsetWidth;lower.style.animation='';});addEventListener('resize',resize);

  return;
 }
 document.title='II Trofeo DIAPIR-0 · Radio Evolución';
 const entries={
  general:{label:'Presentación · Martes 3 nov 2026 · 11:00 h',title:'II Trofeo DIAPIR-0',detail:'Liga Norte de Orientación · Poza de la Sal'},
  arturo:{label:'Intervienen en la presentación',title:'Arturo Pascual',detail:'Diputado responsable de Modernización Administrativa y Nuevas Tecnologías'},

 };
 const order=['general','arturo','general','domingo','general','hector','general','teofilo'];
 const stage=document.querySelector('#overlay-stage');
 const card=document.querySelector('#compact-card');
 const measure=document.querySelector('#compact-measure');
 const logo=document.querySelector('#canvas .brand img').getAttribute('src');
 document.querySelector('#station-logo').src=logo;
 document.querySelector('#card-logo').src=logo;
 let position=0;
 function fitStage(){const scale=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform='scale('+scale+')';stage.style.left=(innerWidth-1920*scale)/2+'px';stage.style.top=(innerHeight-1080*scale)/2+'px';}
 function setEntry(key){
  const item=entries[key]||entries.general;
  const parts=['label','title','detail'];
  for(const part of parts){
   const sizer=measure.querySelector('.compact-'+part);
   sizer.style.fontSize='';sizer.textContent=item[part];
  }
  const sizes={label:13,title:36,detail:23};
  for(const part of parts){
   const sizer=measure.querySelector('.compact-'+part);
   const width=sizer.scrollWidth;
   const size=width>1056?sizes[part]*1056/width:sizes[part];
   sizer.style.fontSize=size+'px';
   const target=document.querySelector('#compact-'+part);
   target.style.fontSize=size+'px';target.textContent=item[part];
  }
  card.style.width=Math.min(1180,Math.max(360,Math.ceil(measure.scrollWidth)+124))+'px';
  card.dataset.entry=key;
 }
 function advance(){
  position=(position+1)%order.length;
  card.classList.add('is-changing');
  setTimeout(()=>{setEntry(order[position]);requestAnimationFrame(()=>card.classList.remove('is-changing'));},280);
 }
 fitStage();addEventListener('resize',fitStage);
 setEntry(order[0]);
 const ready=document.fonts?Promise.all([document.fonts.load('36px Formal'),document.fonts.load('23px Radio'),document.fonts.ready]):Promise.resolve();

})();
